services:
  db:
    image: postgres:17-alpine
    container_name: workout_vault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: workout_secret_password
      POSTGRES_DB: workout_vault
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workout_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: workout_vault_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:workout_secret_password@db:5432/workout_vault
      JWT_SECRET_KEY: workout_vault_super_secret_key_2026_empire
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
